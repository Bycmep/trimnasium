<!DOCTYPE html>
<html lang="en-US">
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="font/blinker.woff2" as="font" type="font/woff2" crossorigin>
<style>
div._loader_ { position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background-color: #ffffffdd;
    display: flex; align-items: center; justify-content: center; z-index: 100;
    &.hide { display: none; } 
    div { width: 5em; display: inline-block; }
}
</style>
</head>
<body>
<script type="module">
const goto = window.location.href.split('/').at(-1).split('?')[0];
if (goto == "") goto = "index";
// const urlParams = new URLSearchParams(window.location.search);
// const loader = new (await import('./loader.js')).Loader;
const loader = {
    alpha: 0, speed: 8,
    run: () => {
        loader.e = document.createElement('div');
        loader.e.classList.add("_loader_");
        loader.spinner = document.createElement('div');
        loader.spinner.innerHTML = `
<svg width="100%" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" stroke-width="0">
<defs>
    <radialGradient id="fade" cx="100%" cy="50%" r="100%">
      <stop offset="30%" /><stop offset="100%" stop-opacity="0.4" />
    </radialGradient>
</defs>
<path fill="url(#fade)" d="M4,16 c0,-6.6 5.4,-12 12,-12 6.6,0 12,5.4 12,12 0,6.6 -5.4,12 -12,12 h-10 c-0.55,0 -1,-0.45 -1,-1 0,-0.55 0.45,-1 1,-1 h10 l-1,-3 h-10 c-0.55,0 -1,-0.45 -1,-1 0,-0.55 0.45,-1 1,-1 h9 c2.6,0 7,0 7,-5 0,-4.4 -3.5,-8 -7,-8 -3,0 -7,0 -10,8z" />
<path fill="#333" d="M11.5,22 c0,-2.2 1.8,-4 4,-4 2.2,0 4,1.8 4,4 0,2 -1.8,4 -4,4 -2.2,0 -4,-1.8 -4,-4z m0.25,-1 l-0.5,-4 c0,-1.2 0.5,-1.2 1,-1 l3,3 h0.5 l3,-3 c0.5,-0.2 1,-0.2 1,1 l-0.5,4z" />
</svg>`;
        loader.e.appendChild(loader.spinner);
        document.body.appendChild(loader.e);
        loader.show();
    },
    show: () => {
        const body = loader.spinner.children[0].children[1];
        const head = loader.spinner.children[0].children[2];
        loader.spin = setInterval(() => {
            body.setAttribute('transform', `rotate(${loader.alpha}, 16, 16)`);
            const dx = -8*Math.sin((loader.alpha)/180*Math.PI);
            const dy = -8 + 8*Math.cos((loader.alpha)/180*Math.PI);
            head.setAttribute('transform', `translate(${dx}, ${dy})`)
            loader.alpha = (loader.alpha + loader.speed)%360;
        }, 20);
        loader.e.classList.remove('hide');
    },
    hide: () => {
        clearInterval(loader.spin); loader.e.classList.add('hide');
    },
    hideWhen: (check) => {
        loader.checker = setInterval(() => {
            if (check()) { clearInterval(loader.checker); loader.hide(); }
        }, 1);
    }
};
loader.run();

function link(url, onload) {
    const e = document.createElement('link');
    e.rel = 'stylesheet'; e.type = 'text/css'; e.href = url;
    document.head.appendChild(e);
    if (onload) e.onload = onload;
}

const page = (await import(`./${goto}.js`)).main(loader, link);
</script>
</body>
</html>
