<!DOCTYPE html>
<html lang="en-US">
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common.css">
<title>Admin options</title>
<style>
    h1 { text-align: center; font-size: 1.5em; font-weight: bold; margin: 0; }
    hr { height: 0.05em; width: 80%; margin: 0 0 0.6em 0; background-color: black; }
    div { width: 98vw; display: flex; flex-direction: column; align-items: center; }
    button { width: 15em; margin: 0.5em; }
    #photos { margin-top: 2em; }
</style>
</head>
<body>
<script type="module">
import { Page } from "./lib/domchain.js";
import { PageParse } from './lib/domchainparse.js';
import { Ajax } from "./lib/ajax2.js";
Page.prototype.parse = PageParse;

Page.body.parse(`div {
    h1(Admin options) hr
    button#categories(Manage categories)
    button#dogs(Manage dogs)
    button#photos(Remove unused photos)
    button#breeds(Remove unused breeds)
    button#ini(Initialize tables)
}`);
Page.$categories.e.onclick = () => { window.location.href = 'categories.html'; }; 
const ajax = new Ajax('ini');
Page.$ini.e.onclick = () => { ajax.post('ini'); }; 
const photos = new Ajax('photos');
Page.$photos.e.onclick = () => { photos.post("clean"); };

</script>
</body>
</html>
